plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.vradbterminal'
    compileSdk 35

    defaultConfig {
        applicationId 'com.example.vradbterminal'
        minSdk 29
        targetSdk 32
        versionCode 1
        versionName '1.0'
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
