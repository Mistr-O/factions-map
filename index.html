<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FactionsVR Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root {
  --bg: #050505;
  --panel: rgba(12, 12, 14, 0.95);
  --panel2: #121216;
  --line: rgba(255, 255, 255, 0.09);
  --text: #f5f5f6;
  --muted: #a0a0a8;
  --red: #ff3f3f;
  --green: #58ff86;
}

html,
body,
#map {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
}

.leaflet-container {
  background: #050505 !important;
}

#lockScreen {
  position: fixed;
  inset: 0;
  z-index: 30000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050505;
  color: white;
}

#lockBox {
  width: min(360px, calc(100vw - 30px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px;
  box-sizing: border-box;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

#lockTitle {
  font-size: 26px;
  font-weight: 800;
}

#lockSub {
  color: var(--muted);
  margin: 6px 0 18px;
}

#passwordInput {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #0b0b0e;
  color: white;
  font-size: 16px;
  outline: none;
}

#unlockBtn {
  width: 100%;
  margin-top: 12px;
}

#lockError {
  display: none;
  margin-top: 12px;
  color: var(--red);
  font-size: 14px;
}

#app {
  display: none;
  width: 100%;
  height: 100%;
}

#sidebar {
  position: absolute;
  left: 14px;
  top: 14px;
  width: 370px;
  height: calc(100vh - 28px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  z-index: 9999;
  color: white;
  overflow: hidden;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.42);
}

#header {
  padding: 17px;
  border-bottom: 1px solid var(--line);
}

#titleRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

#title {
  font-size: 24px;
  font-weight: 800;
}

#livePill {
  color: var(--green);
  background: rgba(88, 255, 134, 0.1);
  border: 1px solid rgba(88, 255, 134, 0.25);
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 800;
}

#subtitle {
  color: var(--muted);
  margin-top: 5px;
  font-size: 14px;
}

#stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 7px;
  padding: 12px;
  border-bottom: 1px solid var(--line);
}

.stat {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
}

.statLabel {
  color: var(--muted);
  font-size: 11px;
}

.statValue {
  margin-top: 3px;
  font-weight: 800;
  font-size: 17px;
}

#searchWrap {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}

#search {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0b0b0e;
  color: white;
  outline: none;
}

#players {
  padding: 12px;
  height: calc(100vh - 263px);
  overflow-y: auto;
  box-sizing: border-box;
}

.player {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 13px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.playerTop {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.playerName {
  color: white;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.onlineStatus,
.offlineStatus {
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.onlineStatus {
  color: var(--green);
}

.offlineStatus {
  color: #85858d;
}

.coords,
.home {
  margin-top: 9px;
  color: #b9b9c0;
  line-height: 1.45;
  font-size: 14px;
}

.home {
  color: #ff9a9a;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 7px;
  margin-top: 11px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 9px 10px;
  cursor: pointer;
  color: white;
  background: var(--red);
  font-weight: 800;
}

.secondary {
  background: #25252c;
}

#topbar {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 9999;
  display: flex;
  gap: 8px;
}

#coordsBox {
  position: absolute;
  right: 14px;
  bottom: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: white;
  padding: 11px 12px;
  border-radius: 8px;
  z-index: 9999;
  font-weight: 800;
}

.leaflet-tooltip {
  background: rgba(10, 10, 12, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: white;
  box-shadow: none;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: #111116;
  color: white;
}

@media (max-width: 760px) {
  #sidebar {
    width: calc(100vw - 28px);
    height: 48vh;
  }

  #players {
    height: calc(48vh - 263px);
    min-height: 115px;
  }

  #topbar {
    left: 14px;
    right: 14px;
    top: auto;
    bottom: 58px;
  }

  #topbar button {
    flex: 1;
  }

  #coordsBox {
    left: 14px;
    right: 14px;
    text-align: center;
  }
}
</style>
</head>

<body>

<div id="lockScreen">
  <div id="lockBox">
    <div id="lockTitle">FactionsVR</div>
    <div id="lockSub">Enter password</div>

    <input id="passwordInput" type="password" placeholder="Password">
    <button id="unlockBtn">Unlock</button>

    <div id="lockError">Wrong password</div>
  </div>
</div>

<div id="app">
  <div id="map"></div>

  <div id="sidebar">
    <div id="header">
      <div id="titleRow">
        <div id="title">FactionsVR</div>
        <div id="livePill">LIVE</div>
      </div>
      <div id="subtitle">Player tracker and saved heat map</div>
    </div>

    <div id="stats">
      <div class="stat">
        <div class="statLabel">Online</div>
        <div class="statValue" id="onlineCount">0</div>
      </div>

      <div class="stat">
        <div class="statLabel">Players</div>
        <div class="statValue" id="playerCount">0</div>
      </div>

      <div class="stat">
        <div class="statLabel">Heat</div>
        <div class="statValue" id="heatCount">0</div>
      </div>
    </div>

    <div id="searchWrap">
      <input id="search" placeholder="Search players...">
    </div>

    <div id="players"></div>
  </div>

  <div id="topbar">
    <button id="heatBtn">Show Heat</button>
    <button id="resetBtn" class="secondary">Reset View</button>
  </div>

  <div id="coordsBox">X: 0 | Z: 0</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
/* =========================
   GLOBALS
========================= */

const PASSWORD = "6768";

const knownPlayers = JSON.parse(localStorage.getItem("knownPlayers") || "{}");

const markers = {};
const hotspotMarkers = [];

let gameMap = null;
let gridLayer = null;
let heatLayer = null;
let heatEnabled = false;
let firstPlayer = true;
let appStarted = false;

/* =========================
   PASSWORD
========================= */

const lockScreen = document.getElementById("lockScreen");
const app = document.getElementById("app");
const passwordInput = document.getElementById("passwordInput");
const unlockBtn = document.getElementById("unlockBtn");
const lockError = document.getElementById("lockError");

function unlock() {
  if (passwordInput.value !== PASSWORD) {
    lockError.style.display = "block";
    passwordInput.select();
    return;
  }

  lockScreen.style.display = "none";
  app.style.display = "block";
  startApp();
}

unlockBtn.onclick = unlock;

passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    unlock();
  }
});

setTimeout(() => {
  passwordInput.focus();
}, 100);

/* =========================
   STORAGE
========================= */

function savePlayers() {
  localStorage.setItem("knownPlayers", JSON.stringify(knownPlayers));
}

/* =========================
   HELPERS
========================= */

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function copy(text) {
  navigator.clipboard.writeText(text);
}

function clusterKey(x, z, size) {
  return `${Math.round(x / size) * size}:${Math.round(z / size) * size}`;
}

function parseKey(key) {
  return key.split(":").map(Number);
}

function updateCoordsBox(latlng) {
  document.getElementById("coordsBox").innerText =
    `X: ${Math.floor(latlng.lng)} | Z: ${Math.floor(-latlng.lat)}`;
}

function getAllHistoryPoints() {
  const points = [];

  Object.values(knownPlayers).forEach(player => {
    if (!Array.isArray(player.history)) {
      return;
    }

    player.history.forEach(point => {
      if (
        typeof point.x === "number" &&
        typeof point.y === "number" &&
        typeof point.z === "number"
      ) {
        points.push(point);
      }
    });
  });

  return points;
}

function updateStats() {
  const players = Object.values(knownPlayers);
  const online = players.filter(player => player.online).length;
  const heatPoints = getAllHistoryPoints().length;

  document.getElementById("onlineCount").innerText = online;
  document.getElementById("playerCount").innerText = players.length;
  document.getElementById("heatCount").innerText = heatPoints;
}

function addPlayerHistory(player, x, y, z) {
  if (!Array.isArray(player.history)) {
    player.history = [];
  }

  const last = player.history[player.history.length - 1];

  if (last) {
    const moved = Math.hypot(x - last.x, z - last.z);

    if (moved < 8 && Math.abs(y - last.y) < 3) {
      return;
    }
  }

  player.history.push({
    x,
    y,
    z,
    time: Date.now()
  });

  if (player.history.length > 1500) {
    player.history.splice(0, player.history.length - 1500);
  }
}

/* =========================
   MAP
========================= */

function setupMap() {
  gameMap = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -10,
    maxZoom: 16,
    zoomSnap: 0.25,
    zoomDelta: 0.25,
    attributionControl: false
  }).setView([0, 0], 0);

  gridLayer = L.layerGroup().addTo(gameMap);

  heatLayer = L.heatLayer([], {
    radius: 34,
    blur: 26,
    maxZoom: 7,
    minOpacity: 0.18,
    gradient: {
      0.10: "#284bff",
      0.28: "#23d7ff",
      0.45: "#31ff82",
      0.62: "#fff34a",
      0.80: "#ff8a2a",
      1.00: "#ff1f1f"
    }
  });

  gameMap.on("zoom move", drawGrid);

  gameMap.on("mousemove", event => {
    updateCoordsBox(event.latlng);
  });

  drawGrid();

  setTimeout(() => {
    gameMap.invalidateSize();
  }, 100);
}

/* =========================
   GRID
========================= */

function drawGrid() {
  if (!gameMap || !gridLayer) {
    return;
  }

  gridLayer.clearLayers();

  const zoom = gameMap.getZoom();

  let size = 100;

  if (zoom <= -2) size = 500;
  if (zoom <= -4) size = 1000;
  if (zoom <= -6) size = 2500;
  if (zoom <= -8) size = 5000;

  const bounds = gameMap.getBounds();

  const minX = Math.floor(bounds.getWest() / size) * size;
  const maxX = Math.ceil(bounds.getEast() / size) * size;

  const minY = Math.floor(bounds.getSouth() / size) * size;
  const maxY = Math.ceil(bounds.getNorth() / size) * size;

  for (let x = minX; x <= maxX; x += size) {
    L.polyline(
      [
        [minY, x],
        [maxY, x]
      ],
      {
        color: "rgba(255,255,255,.07)",
        weight: 1,
        interactive: false
      }
    ).addTo(gridLayer);
  }

  for (let y = minY; y <= maxY; y += size) {
    L.polyline(
      [
        [y, minX],
        [y, maxX]
      ],
      {
        color: "rgba(255,255,255,.07)",
        weight: 1,
        interactive: false
      }
    ).addTo(gridLayer);
  }
}

/* =========================
   LIKELY HOME
========================= */

function getLikelyHome(player) {
  const history = player.history;

  if (!Array.isArray(history) || history.length < 8) {
    return null;
  }

  const scores = {};

  function addScore(x, z, amount, type) {
    const key = clusterKey(x, z, 75);

    if (!scores[key]) {
      const parts = parseKey(key);

      scores[key] = {
        x: parts[0],
        z: parts[1],
        score: 0,
        visits: 0,
        jumps: 0
      };
    }

    scores[key].score += amount;

    if (type === "visit") {
      scores[key].visits += 1;
    }

    if (type === "jump") {
      scores[key].jumps += 1;
    }
  }

  for (let i = 0; i < history.length; i++) {
    const point = history[i];

    if (
      typeof point.x !== "number" ||
      typeof point.z !== "number"
    ) {
      continue;
    }

    addScore(point.x, point.z, 1, "visit");

    if (i > 0) {
      const prev = history[i - 1];

      if (
        typeof prev.x === "number" &&
        typeof prev.z === "number"
      ) {
        const distance = Math.hypot(point.x - prev.x, point.z - prev.z);

        if (distance >= 450) {
          addScore(point.x, point.z, 10, "jump");
        }
      }
    }
  }

  const best = Object.values(scores)
    .sort((a, b) => b.score - a.score)[0];

  if (!best) {
    return null;
  }

  if (best.jumps < 1 && best.visits < 5) {
    return null;
  }

  return {
    x: best.x,
    z: best.z,
    score: best.score,
    visits: best.visits,
    teleports: best.jumps
  };
}

/* =========================
   HEAT MAP
========================= */

function buildHeatData() {
  const buckets = {};
  const points = getAllHistoryPoints();

  points.forEach(point => {
    const key = clusterKey(point.x, point.z, 90);

    if (!buckets[key]) {
      const parts = parseKey(key);

      buckets[key] = {
        x: parts[0],
        z: parts[1],
        count: 0,
        yTotal: 0
      };
    }

    buckets[key].count += 1;
    buckets[key].yTotal += point.y;
  });

  return Object.values(buckets);
}

function refreshHeatMap() {
  if (!heatLayer) {
    return;
  }

  const buckets = buildHeatData();

  if (!buckets.length) {
    heatLayer.setLatLngs([]);
    clearHotspots();
    updateStats();
    return;
  }

  const maxCount = Math.max(...buckets.map(bucket => bucket.count));

  const heatPoints = buckets.map(bucket => {
    const strength = Math.max(
      0.12,
      Math.min(1, Math.sqrt(bucket.count / maxCount))
    );

    return [
      -bucket.z,
      bucket.x,
      strength
    ];
  });

  heatLayer.setLatLngs(heatPoints);

  if (heatEnabled) {
    buildHeatInspector(buckets);
  }

  updateStats();
}

function clearHotspots() {
  hotspotMarkers.forEach(marker => {
    gameMap.removeLayer(marker);
  });

  hotspotMarkers.length = 0;
}

function buildHeatInspector(existingBuckets) {
  clearHotspots();

  const buckets = existingBuckets || buildHeatData();

  buckets
    .filter(bucket => bucket.count >= 2)
    .sort((a, b) => b.count - a.count)
    .slice(0, 80)
    .forEach(bucket => {
      const avgY = Math.round(bucket.yTotal / bucket.count);
      const radius = Math.min(1200, 150 + bucket.count * 18);

      const marker = L.circle(
        [-bucket.z, bucket.x],
        {
          radius,
          color: "rgba(255,255,255,0.32)",
          weight: 1,
          fillColor: "#ffffff",
          fillOpacity: 0.035
        }
      ).addTo(gameMap);

      marker.on("click", () => {
        const html = `
          <h3>Heat Spot</h3>
          <b>X:</b> ${bucket.x}<br>
          <b>Z:</b> ${bucket.z}<br>
          <b>Avg Y:</b> ${avgY}<br>
          <b>Sightings:</b> ${bucket.count}
        `;

        L.popup()
          .setLatLng([-bucket.z, bucket.x])
          .setContent(html)
          .openOn(gameMap);
      });

      hotspotMarkers.push(marker);
    });
}

/* =========================
   BUTTONS
========================= */

function setupButtons() {
  document.getElementById("heatBtn").onclick = () => {
    heatEnabled = !heatEnabled;

    if (heatEnabled) {
      heatLayer.addTo(gameMap);
      buildHeatInspector();
      document.getElementById("heatBtn").innerText = "Hide Heat";
    } else {
      gameMap.removeLayer(heatLayer);
      clearHotspots();
      document.getElementById("heatBtn").innerText = "Show Heat";
    }
  };

  document.getElementById("resetBtn").onclick = () => {
    gameMap.setView([0, 0], 0);
  };
}

/* =========================
   PLAYER FETCH
========================= */

async function loadPlayers() {
  try {
    const response = await fetch("https://factions-map.onrender.com/players");

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.players) {
      throw new Error("No players array found");
    }

    Object.keys(knownPlayers).forEach(name => {
      knownPlayers[name].online = false;
    });

    data.players.forEach(playerData => {
      if (
        !playerData.Username ||
        !playerData.Pose ||
        !playerData.Pose.Head ||
        !playerData.Pose.Head.Position
      ) {
        return;
      }

      const username = playerData.Username;

      const x = Math.floor(playerData.Pose.Head.Position[0]);
      const y = Math.floor(playerData.Pose.Head.Position[1]);
      const z = Math.floor(playerData.Pose.Head.Position[2]);

      const lat = -z;
      const lng = x;

      if (firstPlayer) {
        gameMap.setView([lat, lng], 2);
        firstPlayer = false;
      }

      if (!knownPlayers[username]) {
        knownPlayers[username] = {
          history: []
        };
      }

      const player = knownPlayers[username];

      player.x = x;
      player.y = y;
      player.z = z;
      player.lat = lat;
      player.lng = lng;
      player.online = true;
      player.lastSeen = Date.now();

      addPlayerHistory(player, x, y, z);

      if (!markers[username]) {
        markers[username] =
          L.circleMarker([lat, lng], {
            radius: 8,
            color: "#ff3f3f",
            fillColor: "#ff3f3f",
            fillOpacity: 1,
            weight: 2
          }).addTo(gameMap);

        markers[username].bindTooltip(
          escapeHTML(username),
          {
            permanent: true,
            direction: "top"
          }
        );
      } else {
        markers[username].setLatLng([lat, lng]);
      }
    });

    savePlayers();
    refreshHeatMap();
    renderPlayers();
  } catch (err) {
    document.getElementById("players").innerHTML =
      `<div style="padding:15px;color:#ff6b6b">
        API ERROR<br><br>
        ${escapeHTML(err.message)}
      </div>`;

    console.error(err);
  }
}

/* =========================
   PLAYER LIST
========================= */

function renderPlayers() {
  const container = document.getElementById("players");

  const search = document.getElementById("search")
    .value
    .toLowerCase();

  container.innerHTML = "";

  const players = Object.entries(knownPlayers)
    .sort((a, b) => {
      if (b[1].online !== a[1].online) {
        return b[1].online - a[1].online;
      }

      return (b[1].lastSeen || 0) - (a[1].lastSeen || 0);
    });

  players.forEach(([name, player]) => {
    if (!name.toLowerCase().includes(search)) {
      return;
    }

    const home = getLikelyHome(player);

    const div = document.createElement("div");

    div.className = "player";

    div.innerHTML = `
      <div class="playerTop">
        <div class="playerName">${escapeHTML(name)}</div>

        <div class="${
          player.online
            ? "onlineStatus"
            : "offlineStatus"
        }">
          ${
            player.online
              ? "ONLINE"
              : "OFFLINE"
          }
        </div>
      </div>

      <div class="coords">
        X: ${player.x ?? "?"}<br>
        Y: ${player.y ?? "?"}<br>
        Z: ${player.z ?? "?"}<br>
        Saved points: ${
          Array.isArray(player.history)
            ? player.history.length
            : 0
        }
      </div>

      <div class="home">
        ${
          home
            ? `Likely Home X:${home.x} Z:${home.z}<br>Visits:${home.visits} | Jumps:${home.teleports}`
            : "Likely home unknown"
        }
      </div>

      <div class="buttons">
        <button class="tp">Copy TP</button>
        <button class="homeBtn">Copy Home</button>
        <button class="secondary view">View</button>
      </div>
    `;

    div.querySelector(".tp").onclick = () => {
      copy(`${player.x} ${player.y} ${player.z}`);
    };

    div.querySelector(".homeBtn").onclick = () => {
      if (!home) {
        return;
      }

      copy(`${home.x} ${home.z}`);
    };

    div.querySelector(".view").onclick = () => {
      if (
        player.lat === undefined ||
        player.lng === undefined
      ) {
        return;
      }

      gameMap.setView([player.lat, player.lng], 4);
    };

    container.appendChild(div);
  });

  updateStats();
}

/* =========================
   SEARCH
========================= */

function setupSearch() {
  document.getElementById("search").addEventListener(
    "input",
    renderPlayers
  );
}

/* =========================
   START
========================= */

function startApp() {
  if (appStarted) {
    return;
  }

  appStarted = true;

  setupMap();
  setupButtons();
  setupSearch();

  renderPlayers();
  refreshHeatMap();
  loadPlayers();
