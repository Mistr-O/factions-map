<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FactionsVR Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root {
  --bg: #050505;
  --panel: rgba(12, 12, 14, 0.94);
  --panel-strong: #111114;
  --panel-soft: #19191d;
  --border: rgba(255, 255, 255, 0.08);
  --text: #f4f4f5;
  --muted: #9b9ba1;
  --danger: #ff4d4d;
  --green: #5cff84;
  --accent: #ff3b3b;
  --yellow: #ffd43b;
}

html,
body,
#map {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
}

.leaflet-container {
  background: #050505 !important;
}

#lockScreen {
  position: fixed;
  inset: 0;
  z-index: 20000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(circle at center, #191919 0%, #050505 58%);
  color: white;
}

#lockBox {
  width: min(360px, calc(100vw - 32px));
  background: rgba(12, 12, 14, 0.96);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 22px;
  box-sizing: border-box;
  box-shadow: 0 18px 50px rgba(0, 0, 0, 0.45);
}

#lockTitle {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 4px;
}

#lockSub {
  color: var(--muted);
  margin-bottom: 18px;
}

#passwordInput {
  width: 100%;
  box-sizing: border-box;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  outline: none;
  background: #0b0b0d;
  color: white;
  font-size: 16px;
}

#passwordInput:focus {
  border-color: rgba(255, 77, 77, 0.7);
}

#unlockBtn {
  width: 100%;
  margin-top: 12px;
  padding: 12px;
  font-weight: 700;
}

#lockError {
  display: none;
  color: var(--danger);
  margin-top: 12px;
  font-size: 14px;
}

#app {
  display: none;
  width: 100%;
  height: 100%;
}

#sidebar {
  position: absolute;
  left: 14px;
  top: 14px;
  width: 360px;
  height: calc(100vh - 28px);
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 14px;
  z-index: 9999;
  color: white;
  overflow: hidden;
  box-shadow: 0 14px 45px rgba(0, 0, 0, 0.35);
}

#header {
  padding: 18px 18px 12px;
  border-bottom: 1px solid var(--border);
}

#titleRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 12px;
}

#title {
  font-size: 24px;
  font-weight: 800;
  letter-spacing: 0;
}

#livePill {
  background: rgba(92, 255, 132, 0.12);
  color: var(--green);
  border: 1px solid rgba(92, 255, 132, 0.22);
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 700;
}

#subtitle {
  color: var(--muted);
  margin-top: 5px;
  font-size: 14px;
}

#stats {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
}

.stat {
  background: var(--panel-strong);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px;
}

.statLabel {
  color: var(--muted);
  font-size: 12px;
}

.statValue {
  color: var(--text);
  font-size: 18px;
  font-weight: 800;
  margin-top: 3px;
}

#searchWrap {
  padding: 12px 18px;
  border-bottom: 1px solid var(--border);
}

#search {
  width: 100%;
  padding: 12px 13px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: #0b0b0d;
  color: white;
  box-sizing: border-box;
  outline: none;
}

#search:focus {
  border-color: rgba(255, 77, 77, 0.65);
}

#players {
  padding: 12px;
  height: calc(100vh - 250px);
  overflow-y: auto;
  box-sizing: border-box;
}

.player {
  background: var(--panel-strong);
  border: 1px solid var(--border);
  padding: 13px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.playerTop {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.playerName {
  color: white;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.onlineStatus,
.offlineStatus {
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.onlineStatus {
  color: var(--green);
}

.offlineStatus {
  color: #8b8b91;
}

.coords {
  margin-top: 9px;
  color: #b8b8be;
  line-height: 1.45;
  font-size: 14px;
}

.home {
  margin-top: 9px;
  color: #ff8f8f;
  line-height: 1.45;
  font-size: 14px;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-top: 11px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 9px 10px;
  cursor: pointer;
  color: white;
  background: var(--accent);
  font-weight: 700;
}

button:hover {
  filter: brightness(1.1);
}

.secondary {
  background: #25252b;
}

#topbar {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 9999;
  display: flex;
  gap: 8px;
}

#coordsBox {
  position: absolute;
  right: 14px;
  bottom: 14px;
  background: var(--panel);
  border: 1px solid var(--border);
  color: white;
  padding: 11px 12px;
  border-radius: 10px;
  z-index: 9999;
  font-weight: 700;
}

.leaflet-tooltip {
  background: rgba(10, 10, 12, 0.9);
  border: 1px solid rgba(255, 255, 255, 0.12);
  color: white;
  box-shadow: none;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: #111114;
  color: white;
}

@media (max-width: 760px) {
  #sidebar {
    width: calc(100vw - 28px);
    height: 46vh;
  }

  #players {
    height: calc(46vh - 250px);
    min-height: 120px;
  }

  #topbar {
    left: 14px;
    right: 14px;
    top: auto;
    bottom: 58px;
  }

  #topbar button {
    flex: 1;
  }

  #coordsBox {
    left: 14px;
    right: 14px;
    text-align: center;
  }
}
</style>
</head>

<body>
<div id="lockScreen">
  <div id="lockBox">
    <div id="lockTitle">FactionsVR</div>
    <div id="lockSub">Enter password to open tracker</div>

    <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password">
    <button id="unlockBtn">Unlock</button>

    <div id="lockError">Wrong password</div>
  </div>
</div>

<div id="app">
  <div id="map"></div>

  <div id="sidebar">
    <div id="header">
      <div id="titleRow">
        <div id="title">FactionsVR</div>
        <div id="livePill">LIVE</div>
      </div>
      <div id="subtitle">Player tracker and heat map</div>
    </div>

    <div id="stats">
      <div class="stat">
        <div class="statLabel">Online</div>
        <div class="statValue" id="onlineCount">0</div>
      </div>

      <div class="stat">
        <div class="statLabel">Heat Points</div>
        <div class="statValue" id="heatCount">0</div>
      </div>
    </div>

    <div id="searchWrap">
      <input id="search" placeholder="Search players...">
    </div>

    <div id="players"></div>
  </div>

  <div id="topbar">
    <button id="heatBtn">Heat Map</button>
    <button id="resetBtn" class="secondary">Reset View</button>
  </div>

  <div id="coordsBox">
    X: 0 | Z: 0
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
/* =========================
   PASSWORD
========================= */

const PASSWORD = "6768";

const lockScreen = document.getElementById("lockScreen");
const app = document.getElementById("app");
const passwordInput = document.getElementById("passwordInput");
const unlockBtn = document.getElementById("unlockBtn");
const lockError = document.getElementById("lockError");

let appStarted = false;

function unlock() {
  if (passwordInput.value !== PASSWORD) {
    lockError.style.display = "block";
    passwordInput.select();
    return;
  }

  sessionStorage.setItem("factionsTrackerUnlocked", "true");
  lockScreen.style.display = "none";
  app.style.display = "block";

  startApp();
}

unlockBtn.onclick = unlock;

passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    unlock();
  }
});

if (sessionStorage.getItem("factionsTrackerUnlocked") === "true") {
  lockScreen.style.display = "none";
  app.style.display = "block";
  startApp();
}

/* =========================
   STORAGE
========================= */

const knownPlayers = JSON.parse(localStorage.getItem("knownPlayers") || "{}");
const locationData = JSON.parse(localStorage.getItem("locationData") || "{}");

function savePlayers() {
  localStorage.setItem("knownPlayers", JSON.stringify(knownPlayers));
}

function saveHeatData() {
  localStorage.setItem("locationData", JSON.stringify(locationData));
}

/* =========================
   DATA
========================= */

const markers = {};
const hotspotMarkers = [];

let map;
let gridLayer;
let heatLayer;
let heatEnabled = false;
let firstPlayer = true;
let pollTimer = null;

/* =========================
   HELPERS
========================= */

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function copy(text) {
  navigator.clipboard.writeText(text);
}

function updateCoordsBox(latlng) {
  document.getElementById("coordsBox").innerText =
    `X: ${Math.floor(latlng.lng)} | Z: ${Math.floor(-latlng.lat)}`;
}

function addPlayerHistory(player, x, y, z) {
  if (!player.history) {
    player.history = [];
  }

  const last = player.history[player.history.length - 1];

  if (
    last &&
    last.x === x &&
    last.y === y &&
    last.z === z
  ) {
    return;
  }

  player.history.push({
    x,
    y,
    z,
    time: Date.now()
  });

  if (player.history.length > 700) {
    player.history.shift();
  }
}

function updateStats() {
  const onlineCount = Object.values(knownPlayers)
    .filter(player => player.online)
    .length;

  const heatCount = Object.values(locationData)
    .reduce((total, spot) => total + (spot.count || 0), 0);

  document.getElementById("onlineCount").innerText = onlineCount;
  document.getElementById("heatCount").innerText = heatCount;
}

/* =========================
   MAP
========================= */

function setupMap() {
  map = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -10,
    maxZoom: 16,
    zoomSnap: 0.25,
    zoomDelta: 0.25,
    attributionControl: false
  }).setView([0, 0], 0);

  gridLayer = L.layerGroup().addTo(map);

  heatLayer = L.heatLayer([], {
    radius: 26,
    blur: 22,
    maxZoom: 8,
    minOpacity: 0.25,
    gradient: {
      0.15: "#2b59ff",
      0.35: "#2dff9a",
      0.55: "#fff34d",
      0.75: "#ff8a2b",
      1.0: "#ff2424"
    }
  });

  map.on("zoom move", drawGrid);

  map.on("mousemove", event => {
    updateCoordsBox(event.latlng);
  });

  drawGrid();

  setTimeout(() => {
    map.invalidateSize();
  }, 100);
}

/* =========================
   GRID
========================= */

function drawGrid() {
  gridLayer.clearLayers();

  const zoom = map.getZoom();

  let size = 100;

  if (zoom <= -2) size = 500;
  if (zoom <= -4) size = 1000;
  if (zoom <= -6) size = 2500;
  if (zoom <= -8) size = 5000;

  const bounds = map.getBounds();

  const minX = Math.floor(bounds.getWest() / size) * size;
  const maxX = Math.ceil(bounds.getEast() / size) * size;

  const minY = Math.floor(bounds.getSouth() / size) * size;
  const maxY = Math.ceil(bounds.getNorth() / size) * size;

  for (let x = minX; x <= maxX; x += size) {
    L.polyline(
      [
        [minY, x],
        [maxY, x]
      ],
      {
        color: "rgba(255,255,255,.07)",
        weight: 1,
        interactive: false
      }
    ).addTo(gridLayer);
  }

  for (let y = minY; y <= maxY; y += size) {
    L.polyline(
      [
        [y, minX],
        [y, maxX]
      ],
      {
        color: "rgba(255,255,255,.07)",
        weight: 1,
        interactive: false
      }
    ).addTo(gridLayer);
  }
}

/* =========================
   HOME DETECTION
========================= */

function getLikelyHome(history) {
  if (!history || history.length < 5) {
    return null;
  }

  const teleports = {};

  for (let i = 1; i < history.length; i++) {
    const prev = history[i - 1];
    const curr = history[i];

    const distance = Math.hypot(
      curr.x - prev.x,
      curr.z - prev.z
    );

    if (distance < 500) {
      continue;
    }

    const x = Math.round(curr.x / 50) * 50;
    const z = Math.round(curr.z / 50) * 50;

    const key = `${x}:${z}`;

    teleports[key] = (teleports[key] || 0) + 1;
  }

  let bestKey = null;
  let bestCount = 0;

  for (const key in teleports) {
    if (teleports[key] > bestCount) {
      bestCount = teleports[key];
      bestKey = key;
    }
  }

  if (!bestKey) {
    return null;
  }

  const parts = bestKey.split(":").map(Number);

  return {
    x: parts[0],
    z: parts[1],
    teleports: bestCount
  };
}

/* =========================
   HEAT MAP
========================= */

function recordHeatPoint(username, x, y, z) {
  const gridX = Math.round(x / 125) * 125;
  const gridZ = Math.round(z / 125) * 125;
  const key = `${gridX}:${gridZ}`;

  if (!locationData[key]) {
    locationData[key] = {
      x: gridX,
      z: gridZ,
      count: 0,
      players: {}
    };
  }

  const spot = locationData[key];

  spot.count += 1;
  spot.lastSeen = Date.now();

  if (!spot.players[username]) {
    spot.players[username] = {
      visits: 0,
      firstSeen: Date.now(),
      lastSeen: Date.now(),
      yValues: []
    };
  }

  const playerSpot = spot.players[username];

  playerSpot.visits += 1;
  playerSpot.lastSeen = Date.now();
  playerSpot.yValues.push(y);

  if (playerSpot.yValues.length > 100) {
    playerSpot.yValues.shift();
  }
}

function getHeatPoints() {
  const spots = Object.values(locationData);

  if (!spots.length) {
    return [];
  }

  const maxCount = Math.max(...spots.map(spot => spot.count || 1));

  return spots.map(spot => {
    const strength = Math.max(
      0.15,
      Math.min(1, Math.log((spot.count || 1) + 1) / Math.log(maxCount + 1))
    );

    return [
      -spot.z,
      spot.x,
      strength
    ];
  });
}

function refreshHeatMap() {
  heatLayer.setLatLngs(getHeatPoints());

  if (heatEnabled) {
    buildHeatInspector();
  }

  updateStats();
}

function clearHotspots() {
  hotspotMarkers.forEach(marker => {
    map.removeLayer(marker);
  });

  hotspotMarkers.length = 0;
}

function buildHeatInspector() {
  clearHotspots();

  Object.values(locationData).forEach(spot => {
    if ((spot.count || 0) < 3) {
      return;
    }

    const radius = Math.min(900, 160 + (spot.count * 10));

    const marker = L.circle(
      [-spot.z, spot.x],
      {
        radius,
        color: "rgba(255, 255, 255, 0.25)",
        weight: 1,
        fillColor: "#ffffff",
        fillOpacity: 0.02
      }
    ).addTo(map);

    marker.on("click", () => {
      let html = `
        <h3>Heat Spot</h3>
        <b>X:</b> ${spot.x}<br>
        <b>Z:</b> ${spot.z}<br>
        <b>Total sightings:</b> ${spot.count}<br><br>
      `;

      Object.entries(spot.players)
        .sort((a, b) => b[1].visits - a[1].visits)
        .slice(0, 12)
        .forEach(([name, info]) => {
          const avgY = Math.round(
            info.yValues.reduce((a, b) => a + b, 0) / info.yValues.length
          );

          html += `
            <b>${escapeHTML(name)}</b><br>
            Visits: ${info.visits}<br>
            Avg Y: ${avgY}<br><br>
          `;
        });

      L.popup()
        .setLatLng([-spot.z, spot.x])
        .setContent(html)
        .openOn(map);
    });

    hotspotMarkers.push(marker);
  });
}

/* =========================
   BUTTONS
========================= */

function setupButtons() {
  document.getElementById("heatBtn").onclick = () => {
    heatEnabled = !heatEnabled;

    if (heatEnabled) {
      heatLayer.addTo(map);
      buildHeatInspector();
      document.getElementById("heatBtn").innerText = "Hide Heat";
    } else {
      map.removeLayer(heatLayer);
      clearHotspots();
      document.getElementById("heatBtn").innerText = "Heat Map";
    }
  };

  document.getElementById("resetBtn").onclick = () => {
    map.setView([0, 0], 0);
  };
}

/* =========================
   PLAYER FETCH
========================= */

async function loadPlayers() {
  try {
    const response = await fetch("https://factions-map.onrender.com/players");

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.players) {
      console.error("No players array found");
      return;
    }

    Object.keys(knownPlayers).forEach(name => {
      knownPlayers[name].online = false;
    });

    data.players.forEach(playerData => {
      if (
        !playerData.Username ||
        !playerData.Pose ||
        !playerData.Pose.Head ||
        !playerData.Pose.Head.Position
      ) {
        return;
      }

      const username = playerData.Username;

      const x = Math.floor(playerData.Pose.Head.Position[0]);
      const y = Math.floor(playerData.Pose.Head.Position[1]);
      const z = Math.floor(playerData.Pose.Head.Position[2]);

      const lat = -z;
      const lng = x;

      if (firstPlayer) {
        map.setView([lat, lng], 2);
        firstPlayer = false;
      }

      if (!knownPlayers[username]) {
        knownPlayers[username] = {
          history: []
        };
      }

      const player = knownPlayers[username];

      player.x = x;
      player.y = y;
      player.z = z;
      player.lat = lat;
      player.lng = lng;
      player.online = true;
      player.lastSeen = Date.now();

      addPlayerHistory(player, x, y, z);
      recordHeatPoint(username, x, y, z);

      if (!markers[username]) {
        markers[username] =
          L.circleMarker([lat, lng], {
            radius: 8,
            color: "#ff3b3b",
            fillColor: "#ff3b3b",
            fillOpacity: 1,
            weight: 2
          }).addTo(map);

        markers[username].bindTooltip(
          escapeHTML(username),
          {
            permanent: true,
            direction: "top"
          }
        );
      } else {
        markers[username].setLatLng([lat, lng]);
      }
    });

    savePlayers();
    saveHeatData();
    refreshHeatMap();
    renderPlayers();
  } catch (err) {
    document.getElementById("players").innerHTML =
      `<div style="padding:15px;color:#ff6b6b">
        API ERROR<br><br>
        ${escapeHTML(err.message)}
      </div>`;

    console.error(err);
  }
}

/* =========================
   PLAYER LIST
========================= */

function renderPlayers() {
  const container = document.getElementById("players");

  const search = document.getElementById("search")
    .value
    .toLowerCase();

  container.innerHTML = "";

  const players = Object.entries(knownPlayers)
    .sort((a, b) => {
      if (b[1].online !== a[1].online) {
        return b[1].online - a[1].online;
      }

      return (b[1].lastSeen || 0) - (a[1].lastSeen || 0);
    });

  players.forEach(([name, player]) => {
    if (!name.toLowerCase().includes(search)) {
      return;
    }

    const home = getLikelyHome(player.history);

    const div = document.createElement("div");

    div.className = "player";

    div.innerHTML = `
      <div class="playerTop">
        <div class="playerName">
          ${escapeHTML(name)}
        </div>

        <div class="${
          player.online
            ? "onlineStatus"
            : "offlineStatus"
        }">
          ${
            player.online
              ? "ONLINE"
              : "OFFLINE"
          }
        </div>
      </div>

      <div class="coords">
        X: ${player.x ?? "?"}<br>
        Y: ${player.y ?? "?"}<br>
        Z: ${player.z ?? "?"}
      </div>

      <div class="home">
        ${
          home
            ? `Home X:${home.x} Z:${home.z}<br>Teleports:${home.teleports}`
            : "Home unknown"
        }
      </div>

      <div class="buttons">
        <button class="tp">Copy TP</button>
        <button class="homeBtn">Copy Home</button>
        <button class="secondary view">View</button>
      </div>
    `;

    div.querySelector(".tp").onclick = () => {
      copy(`${player.x} ${player.y} ${player.z}`);
    };

    div.querySelector(".homeBtn").onclick = () => {
      if (!home) return;

      copy(`${home.x} ${home.z}`);
    };

    div.querySelector(".view").onclick = () => {
      if (
        player.lat === undefined ||
        player.lng === undefined
      ) {
        return;
      }

      map.setView([player.lat, player.lng], 4);
    };

    container.appendChild(div);
  });

  updateStats();
}

/* =========================
   SEARCH
========================= */

function setupSearch() {
  document.getElementById("search").addEventListener(
    "input",
    renderPlayers
  );
}

/* =========================
   START
========================= */

function startApp() {
  if (appStarted) {
    return;
  }

  appStarted = true;

  setupMap();
  setupButtons();
  setupSearch();

  refreshHeatMap();
  renderPlayers();
  loadPlayers();

  pollTimer = setInterval(
    loadPlayers,
    3000
  );
}
</script>
