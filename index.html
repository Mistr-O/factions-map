<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FactionsVR Tracker</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
:root {
  --bg: #050505;
  --panel: rgba(12, 12, 14, 0.96);
  --panel2: #121216;
  --line: rgba(255, 255, 255, 0.1);
  --muted: #a0a0a8;
  --red: #ff3f3f;
  --blue: #45a3ff;
  --green: #58ff86;
  --yellow: #ffe15a;
}

html,
body,
#map {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  font-family: Arial, Helvetica, sans-serif;
}

.leaflet-container {
  background: #050505 !important;
}

#lockScreen {
  position: fixed;
  inset: 0;
  z-index: 30000;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #050505;
  color: white;
}

#lockBox {
  width: min(360px, calc(100vw - 30px));
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px;
  box-sizing: border-box;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
}

#lockTitle {
  font-size: 26px;
  font-weight: 800;
}

#lockSub {
  color: var(--muted);
  margin: 6px 0 18px;
}

#passwordInput {
  width: 100%;
  box-sizing: border-box;
  padding: 13px;
  border-radius: 8px;
  border: 1px solid var(--line);
  background: #0b0b0e;
  color: white;
  font-size: 16px;
  outline: none;
}

#unlockBtn {
  width: 100%;
  margin-top: 12px;
}

#lockError {
  display: none;
  margin-top: 12px;
  color: var(--red);
  font-size: 14px;
}

#app {
  display: none;
  width: 100%;
  height: 100%;
}

#sidebar {
  position: absolute;
  left: 14px;
  top: 14px;
  width: 380px;
  height: calc(100vh - 28px);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 12px;
  z-index: 9999;
  color: white;
  overflow: hidden;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.42);
}

#header {
  padding: 17px;
  border-bottom: 1px solid var(--line);
}

#titleRow {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}

#title {
  font-size: 24px;
  font-weight: 800;
}

#livePill {
  color: var(--green);
  background: rgba(88, 255, 134, 0.1);
  border: 1px solid rgba(88, 255, 134, 0.25);
  border-radius: 999px;
  padding: 5px 9px;
  font-size: 12px;
  font-weight: 800;
}

#subtitle {
  color: var(--muted);
  margin-top: 5px;
  font-size: 14px;
}

#stats {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 7px;
  padding: 12px;
  border-bottom: 1px solid var(--line);
}

.stat {
  background: var(--panel2);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 9px;
}

.statLabel {
  color: var(--muted);
  font-size: 11px;
}

.statValue {
  margin-top: 3px;
  font-weight: 800;
  font-size: 17px;
}

#searchWrap {
  padding: 12px;
  border-bottom: 1px solid var(--line);
}

#search {
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #0b0b0e;
  color: white;
  outline: none;
}

#players {
  padding: 12px;
  height: calc(100vh - 263px);
  overflow-y: auto;
  box-sizing: border-box;
}

.player {
  background: var(--panel2);
  border: 1px solid var(--line);
  padding: 13px;
  border-radius: 8px;
  margin-bottom: 10px;
}

.playerTop {
  display: flex;
  justify-content: space-between;
  gap: 10px;
}

.playerName {
  color: white;
  font-weight: 800;
  overflow-wrap: anywhere;
}

.onlineStatus,
.offlineStatus {
  font-size: 12px;
  font-weight: 800;
  white-space: nowrap;
}

.onlineStatus {
  color: var(--green);
}

.offlineStatus {
  color: #85858d;
}

.coords,
.home {
  margin-top: 9px;
  color: #b9b9c0;
  line-height: 1.45;
  font-size: 14px;
}

.home {
  color: #ff9a9a;
}

.buttons {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 7px;
  margin-top: 11px;
}

button {
  border: none;
  border-radius: 8px;
  padding: 9px 10px;
  cursor: pointer;
  color: white;
  background: var(--red);
  font-weight: 800;
}

.secondary {
  background: #25252c;
}

#topbar {
  position: absolute;
  top: 14px;
  right: 14px;
  z-index: 12000;
  display: flex;
  gap: 8px;
}

#randomPanel {
  position: absolute;
  top: 58px;
  right: 14px;
  z-index: 13000;
  display: none;
  flex-direction: column;
  gap: 8px;
  min-width: 260px;
  background: rgba(12, 12, 14, 0.98);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 10px;
  color: white;
  box-shadow: 0 16px 45px rgba(0, 0, 0, 0.55);
}

#randomChoices {
  display: flex;
  gap: 8px;
}

#randomChoices button {
  flex: 1;
}

#randomMessage {
  color: #ddd;
  font-size: 13px;
  line-height: 1.35;
}

#coordsBox {
  position: absolute;
  right: 14px;
  bottom: 14px;
  background: var(--panel);
  border: 1px solid var(--line);
  color: white;
  padding: 11px 12px;
  border-radius: 8px;
  z-index: 9999;
  font-weight: 800;
}

.mapTile {
  image-rendering: pixelated;
  background: #050505;
}

.cubeIcon {
  background: transparent;
}

.cubeMarker {
  width: 100%;
  height: 100%;
  box-sizing: border-box;
  border: 2px solid rgba(255,255,255,0.9);
  box-shadow:
    0 0 0 1px rgba(0,0,0,0.8),
    0 0 18px currentColor;
}

.cubeHead {
  background: #ff3f3f;
  color: #ff3f3f;
}

.cubeLeft {
  background: #45a3ff;
  color: #45a3ff;
}

.cubeRight {
  background: #ffe15a;
  color: #ffe15a;
}

.leaflet-tooltip {
  background: rgba(10, 10, 12, 0.92);
  border: 1px solid rgba(255, 255, 255, 0.14);
  color: white;
  box-shadow: none;
}

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {
  background: #111116;
  color: white;
}

@media (max-width: 760px) {
  #sidebar {
    width: calc(100vw - 28px);
    height: 48vh;
  }

  #players {
    height: calc(48vh - 263px);
    min-height: 115px;
  }

  #topbar {
    left: 14px;
    right: 14px;
    top: auto;
    bottom: 58px;
  }

  #topbar button {
    flex: 1;
  }

  #randomPanel {
    left: 14px;
    right: 14px;
    top: auto;
    bottom: 106px;
  }

  #coordsBox {
    left: 14px;
    right: 14px;
    text-align: center;
  }
}
</style>
</head>

<body>

<div id="lockScreen">
  <div id="lockBox">
    <div id="lockTitle">FactionsVR</div>
    <div id="lockSub">Enter password</div>

    <input id="passwordInput" type="password" placeholder="Password">
    <button id="unlockBtn">Unlock</button>

    <div id="lockError">Wrong password</div>
  </div>
</div>

<div id="app">
  <div id="map"></div>

  <div id="sidebar">
    <div id="header">
      <div id="titleRow">
        <div id="title">FactionsVR</div>
        <div id="livePill">LIVE</div>
      </div>
      <div id="subtitle">Player tracker with tiles, hands, and homes</div>
    </div>

    <div id="stats">
      <div class="stat">
        <div class="statLabel">Online</div>
        <div class="statValue" id="onlineCount">0</div>
      </div>

      <div class="stat">
        <div class="statLabel">Players</div>
        <div class="statValue" id="playerCount">0</div>
      </div>

      <div class="stat">
        <div class="statLabel">Heat</div>
        <div class="statValue" id="heatCount">0</div>
      </div>
    </div>

    <div id="searchWrap">
      <input id="search" placeholder="Search players...">
    </div>

    <div id="players"></div>
  </div>

  <div id="topbar">
    <button id="heatBtn">Show Heat</button>
    <button id="randomHomeBtn" class="secondary">Random Home</button>
    <button id="resetBtn" class="secondary">Reset View</button>
  </div>

  <div id="randomPanel">
    <div id="randomChoices">
      <button id="skyBaseBtn">Sky Base</button>
      <button id="undergroundBtn" class="secondary">Underground</button>
    </div>
    <div id="randomMessage">Pick a base type.</div>
  </div>

  <div id="coordsBox">X: 0 | Z: 0</div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
const PASSWORD = "6768";
const UNLOCK_KEY = "factionsTrackerPasswordRemembered";
const TELEPORT_DISTANCE = 50;
const MIN_HOME_TELEPORTS = 2;
const TILE_CACHE_KEY = Date.now();

const knownPlayers = JSON.parse(localStorage.getItem("knownPlayers") || "{}");

const playerParts = {};
const hotspotMarkers = [];

let gameMap = null;
let tileLayer = null;
let gridLayer = null;
let heatLayer = null;
let heatEnabled = false;
let firstPlayer = true;
let appStarted = false;

const lockScreen = document.getElementById("lockScreen");
const app = document.getElementById("app");
const passwordInput = document.getElementById("passwordInput");
const unlockBtn = document.getElementById("unlockBtn");
const lockError = document.getElementById("lockError");

function unlock() {
  if (passwordInput.value !== PASSWORD) {
    lockError.style.display = "block";
    passwordInput.select();
    return;
  }

  localStorage.setItem(UNLOCK_KEY, "true");
  showApp();
}

function showApp() {
  lockScreen.style.display = "none";
  app.style.display = "block";
  startApp();
}

unlockBtn.onclick = unlock;

passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") {
    unlock();
  }
});

if (localStorage.getItem(UNLOCK_KEY) === "true") {
  showApp();
} else {
  setTimeout(() => {
    passwordInput.focus();
  }, 100);
}

function savePlayers() {
  localStorage.setItem("knownPlayers", JSON.stringify(knownPlayers));
}

function escapeHTML(value) {
  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function copy(text) {
  navigator.clipboard.writeText(text).catch(() => {});
}

function formatTime(ms) {
  const totalSeconds = Math.floor(ms / 1000);
  const hours = Math.floor(totalSeconds / 3600);
  const minutes = Math.floor((totalSeconds % 3600) / 60);

  if (hours > 0) {
    return `${hours}h ${minutes}m`;
  }

  return `${minutes}m`;
}

function coordKey(x, y, z) {
  return `${x}:${y}:${z}`;
}

function updateCoordsBox(latlng) {
  document.getElementById("coordsBox").innerText =
    `X: ${Math.floor(latlng.lng)} | Z: ${Math.floor(-latlng.lat)}`;
}

function getAllHistoryPoints() {
  const points = [];

  Object.values(knownPlayers).forEach(player => {
    if (!Array.isArray(player.history)) {
      return;
    }

    player.history.forEach(point => {
      if (
        typeof point.x === "number" &&
        typeof point.y === "number" &&
        typeof point.z === "number"
      ) {
        points.push(point);
      }
    });
  });

  return points;
}

function updateStats() {
  const players = Object.values(knownPlayers);
  const online = players.filter(player => player.online).length;
  const heatPoints = getAllHistoryPoints().length;

  document.getElementById("onlineCount").innerText = online;
  document.getElementById("playerCount").innerText = players.length;
  document.getElementById("heatCount").innerText = heatPoints;
}

function addPlayerHistory(player, x, y, z) {
  if (!Array.isArray(player.history)) {
    player.history = [];
  }

  const last = player.history[player.history.length - 1];

  if (last) {
    const moved = Math.hypot(x - last.x, z - last.z);

    if (moved < 1 && Math.abs(y - last.y) < 1) {
      return;
    }
  }

  player.history.push({
    x,
    y,
    z,
    time: Date.now()
  });

  if (player.history.length > 2000) {
    player.history.splice(0, player.history.length - 2000);
  }
}

function readPosition(value) {
  if (!value) {
    return null;
  }

  if (
    Array.isArray(value) &&
    value.length >= 3 &&
    typeof value[0] === "number" &&
    typeof value[1] === "number" &&
    typeof value[2] === "number"
  ) {
    return value;
  }

  if (Array.isArray(value.Position)) {
    return value.Position;
  }

  if (Array.isArray(value.position)) {
    return value.position;
  }

  if (value.Transform && Array.isArray(value.Transform.Position)) {
    return value.Transform.Position;
  }

  if (value.transform && Array.isArray(value.transform.position)) {
    return value.transform.position;
  }

  return null;
}

function findPositionByName(object, wantedNames) {
  if (!object || typeof object !== "object") {
    return null;
  }

  const wanted = wantedNames.map(name => name.toLowerCase());

  for (const key in object) {
    const lowerKey = key.toLowerCase();

    if (wanted.some(name => lowerKey.includes(name))) {
      const directPosition = readPosition(object[key]);

      if (directPosition) {
        return directPosition;
      }
    }
  }

  for (const key in object) {
    const value = object[key];

    if (value && typeof value === "object") {
      const found = findPositionByName(value, wantedNames);

      if (found) {
        return found;
      }
    }
  }

  return null;
}

function pointFromPosition(position) {
  if (!Array.isArray(position) || position.length < 3) {
    return null;
  }

  const x = Math.floor(position[0]);
  const y = Math.floor(position[1]);
  const z = Math.floor(position[2]);

  return {
    x,
    y,
    z,
    lat: -z,
    lng: x
  };
}

function getPlayerBody(playerData) {
  const pose = playerData.Pose || playerData.pose || playerData;

  const headPosition = findPositionByName(pose, [
    "head",
    "hmd",
    "camera"
  ]);

  const leftHandPosition = findPositionByName(pose, [
    "lefthand",
    "left hand",
    "leftcontroller",
    "left controller",
    "lhand",
    "handleft",
    "controllerleft",
    "leftpalm",
    "left palm"
  ]);

  const rightHandPosition = findPositionByName(pose, [
    "righthand",
    "right hand",
    "rightcontroller",
    "right controller",
    "rhand",
    "handright",
    "controllerright",
    "rightpalm",
    "right palm"
  ]);

  return {
    head: pointFromPosition(headPosition),
    leftHand: pointFromPosition(leftHandPosition),
    rightHand: pointFromPosition(rightHandPosition)
  };
}

function setupMap() {
  gameMap = L.map("map", {
    crs: L.CRS.Simple,
    minZoom: -10,
    maxZoom: 16,
    zoomSnap: 0.25,
    zoomDelta: 0.25,
    attributionControl: false
  }).setView([0, 0], 0);

  setupTileLayer();

  gridLayer = L.layerGroup().addTo(gameMap);

  heatLayer = L.heatLayer([], {
    radius: 34,
    blur: 26,
    maxZoom: 7,
    minOpacity: 0.18,
    gradient: {
      0.10: "#284bff",
      0.28: "#23d7ff",
      0.45: "#31ff82",
      0.62: "#fff34a",
      0.80: "#ff8a2a",
      1.00: "#ff1f1f"
    }
  });

  gameMap.on("zoom move", drawGrid);
  gameMap.on("zoomend", updateAllCubeIcons);

  gameMap.on("mousemove", event => {
    updateCoordsBox(event.latlng);
  });

  drawGrid();

  setTimeout(() => {
    gameMap.invalidateSize();
  }, 100);
}

function setupTileLayer() {
  tileLayer = L.gridLayer({
    tileSize: 256,
    noWrap: true,
    minZoom: -10,
    maxZoom: 16,
    opacity: 1,
    zIndex: 1
  });

  tileLayer.createTile = function(coords, done) {
    const tile = document.createElement("img");

    tile.className = "mapTile";
    tile.alt = "";
    tile.width = 256;
    tile.height = 256;

    const chunkX = coords.x;
    const chunkY = coords.y;
    const chunkZoom = coords.z;

    tile.onload = function() {
      done(null, tile);
    };

    tile.onerror = function() {
      tile.style.background = "#050505";
      done(null, tile);
    };

    tile.src =
      `https://wild.factionsvr.com/api/map/chunk/${chunkX}/${chunkY}/${chunkZoom}?t=${TILE_CACHE_KEY}`;

    return tile;
  };

  tileLayer.addTo(gameMap);
}

function drawGrid() {
  if (!gameMap || !gridLayer) {
    return;
  }

  gridLayer.clearLayers();

  const zoom = gameMap.getZoom();

  let size = 100;

  if (zoom <= -2) size = 500;
  if (zoom <= -4) size = 1000;
  if (zoom <= -6) size = 2500;
  if (zoom <= -8) size = 5000;

  const bounds = gameMap.getBounds();

  const minX = Math.floor(bounds.getWest() / size) * size;
  const maxX = Math.ceil(bounds.getEast() / size) * size;

  const minY = Math.floor(bounds.getSouth() / size) * size;
  const maxY = Math.ceil(bounds.getNorth() / size) * size;

  for (let x = minX; x <= maxX; x += size) {
    L.polyline(
      [
        [minY, x],
        [maxY, x]
      ],
      {
        color: "rgba(255,255,255,.07)",
        weight: 1,
        interactive: false
      }
    ).addTo(gridLayer);
  }

  for (let y = minY; y <= maxY; y += size) {
    L.polyline(
      [
        [y, minX],
        [y, maxX]
      ],
      {
        color: "rgba(255,255,255,.07)",
        weight: 1,
        interactive: false
      }
    ).addTo(gridLayer);
  }
}

function cubeSize(type) {
  const zoom = gameMap ? gameMap.getZoom() : 0;
  const zoomOutBoost = Math.max(0, Math.abs(Math.min(0, zoom))) * 5;

  if (type === "head") {
    return Math.min(42, 16 + zoomOutBoost);
  }

  return Math.min(38, 14 + zoomOutBoost);
}

function cubeIcon(type) {
  const size = cubeSize(type);
  const className =
    type === "head"
      ? "cubeHead"
      : type === "left"
        ? "cubeLeft"
        : "cubeRight";

  return L.divIcon({
    className: "cubeIcon",
    html: `<div class="cubeMarker ${className}"></div>`,
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2]
  });
}

function createCubeMarker(point, type) {
  const marker = L.marker(
    [point.lat, point.lng],
    {
      icon: cubeIcon(type),
      zIndexOffset: type === "head" ? 600 : 1200
    }
  ).addTo(gameMap);

  marker.cubeType = type;

  return marker;
}

function updateAllCubeIcons() {
  Object.values(playerParts).forEach(parts => {
    ["head", "leftHand", "rightHand"].forEach(key => {
      const marker = parts[key];

      if (marker && marker.cubeType) {
        marker.setIcon(cubeIcon(marker.cubeType));
      }
    });
  });
}

function updatePlayerBody(username, body) {
  if (!body.head) {
    return;
  }

  if (!playerParts[username]) {
    playerParts[username] = {
      head: null,
      leftHand: null,
      rightHand: null,
      leftLine: null,
      rightLine: null
    };
  }

  const parts = playerParts[username];

  if (!parts.head) {
    parts.head = createCubeMarker(body.head, "head");
    parts.head.bindTooltip(
      escapeHTML(username),
      {
        permanent: true,
        direction: "top"
      }
    );
  } else {
    parts.head.setLatLng([body.head.lat, body.head.lng]);
  }

  if (body.leftHand) {
    if (!parts.leftHand) {
      parts.leftHand = createCubeMarker(body.leftHand, "left");
    } else {
      parts.leftHand.setLatLng([body.leftHand.lat, body.leftHand.lng]);
    }

    if (!parts.leftLine) {
      parts.leftLine = L.polyline(
        [
          [body.head.lat, body.head.lng],
          [body.leftHand.lat, body.leftHand.lng]
        ],
        {
          color: "rgba(69, 163, 255, 0.95)",
          weight: 4,
          interactive: false
        }
      ).addTo(gameMap);
    } else {
      parts.leftLine.setLatLngs([
        [body.head.lat, body.head.lng],
        [body.leftHand.lat, body.leftHand.lng]
      ]);
    }
  }

  if (body.rightHand) {
    if (!parts.rightHand) {
      parts.rightHand = createCubeMarker(body.rightHand, "right");
    } else {
      parts.rightHand.setLatLng([body.rightHand.lat, body.rightHand.lng]);
    }

    if (!parts.rightLine) {
      parts.rightLine = L.polyline(
        [
          [body.head.lat, body.head.lng],
          [body.rightHand.lat, body.rightHand.lng]
        ],
        {
          color: "rgba(255, 225, 90, 0.95)",
          weight: 4,
          interactive: false
        }
      ).addTo(gameMap);
    } else {
      parts.rightLine.setLatLngs([
        [body.head.lat, body.head.lng],
        [body.rightHand.lat, body.rightHand.lng]
      ]);
    }
  }
}

function getLikelyHome(player) {
  const history = player.history;

  if (!Array.isArray(history) || history.length < 2) {
    return null;
  }

  const landings = {};

  for (let i = 1; i < history.length; i++) {
    const prev = history[i - 1];
    const curr = history[i];

    const distance = Math.hypot(curr.x - prev.x, curr.z - prev.z);

    if (distance < TELEPORT_DISTANCE) {
      continue;
    }

    const key = coordKey(curr.x, curr.y, curr.z);

    if (!landings[key]) {
      landings[key] = {
        x: curr.x,
        y: curr.y,
        z: curr.z,
        count: 0
      };
    }

    landings[key].count += 1;
  }

  const best = Object.values(landings)
    .sort((a, b) => b.count - a.count)[0];

  if (!best || best.count < MIN_HOME_TELEPORTS) {
    return null;
  }

  return best;
}

function getAllLikelyHomes() {
  const homes = [];

  Object.entries(knownPlayers).forEach(([name, player]) => {
    const home = getLikelyHome(player);

    if (home) {
      homes.push({
        name,
        x: home.x,
        y: home.y,
        z: home.z,
        count: home.count
      });
    }
  });

  return homes;
}

function setRandomMessage(text) {
  document.getElementById("randomMessage").innerText = text;
}

function showRandomHome(type) {
  const homes = getAllLikelyHomes();

  const filtered = homes.filter(home => {
    if (type === "sky") {
      return home.y > 230;
    }

    if (type === "underground") {
      return home.y < 40;
    }

    return false;
  });

  if (!filtered.length) {
    setRandomMessage(
      type === "sky"
        ? "No sky bases found yet. Need likely homes with Y over 230."
        : "No underground bases found yet. Need likely homes with Y under 40."
    );
    return;
  }

  const chosen = filtered[Math.floor(Math.random() * filtered.length)];

  gameMap.setView([-chosen.z, chosen.x], 5);

  L.popup()
    .setLatLng([-chosen.z, chosen.x])
    .setContent(`
      <h3>${type === "sky" ? "Sky Base" : "Underground"}</h3>
      <b>Player:</b> ${escapeHTML(chosen.name)}<br>
      <b>X:</b> ${chosen.x}<br>
      <b>Y:</b> ${chosen.y}<br>
      <b>Z:</b> ${chosen.z}<br>
      <b>Teleports:</b> ${chosen.count}<br><br>
      ${chosen.x} ${chosen.y} ${chosen.z}
    `)
    .openOn(gameMap);

  copy(`${chosen.x} ${chosen.y} ${chosen.z}`);

  setRandomMessage(
    `${type === "sky" ? "Sky base" : "Underground"}: ${chosen.name} | ${chosen.x} ${chosen.y} ${chosen.z}`
  );
}

function buildHeatData() {
  const buckets = {};
  const points = getAllHistoryPoints();

  points.forEach(point => {
    const x = Math.round(point.x / 90) * 90;
    const z = Math.round(point.z / 90) * 90;
    const key = `${x}:${z}`;

    if (!buckets[key]) {
      buckets[key] = {
        x,
        z,
        count: 0,
        yTotal: 0
      };
    }

    buckets[key].count += 1;
    buckets[key].yTotal += point.y;
  });

  return Object.values(buckets);
}

function refreshHeatMap() {
  if (!heatLayer) {
    return;
  }

  const buckets = buildHeatData();

  if (!buckets.length) {
    heatLayer.setLatLngs([]);
    clearHotspots();
    updateStats();
    return;
  }

  const maxCount = Math.max(...buckets.map(bucket => bucket.count));

  const heatPoints = buckets.map(bucket => {
    const strength = Math.max(
      0.12,
      Math.min(1, Math.sqrt(bucket.count / maxCount))
    );

    return [
      -bucket.z,
      bucket.x,
      strength
    ];
  });

  heatLayer.setLatLngs(heatPoints);

  if (heatEnabled) {
    buildHeatInspector(buckets);
  }

  updateStats();
}

function clearHotspots() {
  hotspotMarkers.forEach(marker => {
    gameMap.removeLayer(marker);
  });

  hotspotMarkers.length = 0;
}

function buildHeatInspector(existingBuckets) {
  clearHotspots();

  const buckets = existingBuckets || buildHeatData();

  buckets
    .filter(bucket => bucket.count >= 2)
    .sort((a, b) => b.count - a.count)
    .slice(0, 80)
    .forEach(bucket => {
      const avgY = Math.round(bucket.yTotal / bucket.count);
      const radius = Math.min(1200, 150 + bucket.count * 18);

      const marker = L.circle(
        [-bucket.z, bucket.x],
        {
          radius,
          color: "rgba(255,255,255,0.32)",
          weight: 1,
          fillColor: "#ffffff",
          fillOpacity: 0.035
        }
      ).addTo(gameMap);

      marker.on("click", () => {
        const html = `
          <h3>Heat Spot</h3>
          <b>X:</b> ${bucket.x}<br>
          <b>Z:</b> ${bucket.z}<br>
          <b>Avg Y:</b> ${avgY}<br>
          <b>Sightings:</b> ${bucket.count}
        `;

        L.popup()
          .setLatLng([-bucket.z, bucket.x])
          .setContent(html)
          .openOn(gameMap);
      });

      hotspotMarkers.push(marker);
    });
}

function setupButtons() {
  document.getElementById("heatBtn").onclick = () => {
    heatEnabled = !heatEnabled;

    if (heatEnabled) {
      heatLayer.addTo(gameMap);
      buildHeatInspector();
      document.getElementById("heatBtn").innerText = "Hide Heat";
    } else {
      gameMap.removeLayer(heatLayer);
      clearHotspots();
      document.getElementById("heatBtn").innerText = "Show Heat";
    }
  };

  document.getElementById("randomHomeBtn").onclick = () => {
    const panel = document.getElementById("randomPanel");

    if (panel.style.display === "flex") {
      panel.style.display = "none";
    } else {
      panel.style.display = "flex";
      setRandomMessage("Pick Sky Base or Underground.");
    }
  };

  document.getElementById("skyBaseBtn").onclick = () => {
    showRandomHome("sky");
  };

  document.getElementById("undergroundBtn").onclick = () => {
    showRandomHome("underground");
  };

  document.getElementById("resetBtn").onclick = () => {
    gameMap.setView([0, 0], 0);
  };
}

async function loadPlayers() {
  const now = Date.now();
  const seenNames = new Set();

  try {
    const response = await fetch("https://factions-map.onrender.com/players");

    if (!response.ok) {
      throw new Error("HTTP " + response.status);
    }

    const data = await response.json();

    if (!data.players) {
      throw new Error("No players array found");
    }

    data.players.forEach(playerData => {
      const username = playerData.Username || playerData.username || playerData.Name;

      if (!username) {
        return;
      }

      const body = getPlayerBody(playerData);

      if (!body.head) {
        console.log("No head position found for", username, playerData);
        return;
      }

      seenNames.add(username);

      const x = body.head.x;
      const y = body.head.y;
      const z = body.head.z;
      const lat = body.head.lat;
      const lng = body.head.lng;

      if (firstPlayer) {
        gameMap.setView([lat, lng], 2);
        firstPlayer = false;
      }

      if (!knownPlayers[username]) {
        knownPlayers[username] = {
          history: [],
          totalOnlineTime: 0,
          lastOnlineTick: null
        };
      }

      const player = knownPlayers[username];

      if (player.lastOnlineTick) {
        player.totalOnlineTime = (player.totalOnlineTime || 0) + (now - player.lastOnlineTick);
      }

      player.lastOnlineTick = now;
      player.x = x;
      player.y = y;
      player.z = z;
      player.lat = lat;
      player.lng = lng;
      player.online = true;
      player.lastSeen = now;
      player.hasLeftHand = !!body.leftHand;
      player.hasRightHand = !!body.rightHand;

      if (body.leftHand) {
        player.leftHand = body.leftHand;
      }

      if (body.rightHand) {
        player.rightHand = body.rightHand;
      }

      addPlayerHistory(player, x, y, z);
      updatePlayerBody(username, body);
    });

    Object.entries(knownPlayers).forEach(([name, player]) => {
      if (!seenNames.has(name)) {
        player.online = false;
        player.lastOnlineTick = null;
      }
    });

    savePlayers();
    refreshHeatMap();
    renderPlayers();
  } catch (err) {
    document.getElementById("players").innerHTML =
      `<div style="padding:15px;color:#ff6b6b">
        API ERROR<br><br>
        ${escapeHTML(err.message)}
      </div>`;

    console.error(err);
  }
}

function renderPlayers() {
  const container = document.getElementById("players");

  const search = document.getElementById("search")
    .value
    .toLowerCase();

  container.innerHTML = "";

  const players = Object.entries(knownPlayers)
    .sort((a, b) => {
      const aTime = a[1].totalOnlineTime || 0;
      const bTime = b[1].totalOnlineTime || 0;

      if (bTime !== aTime) {
        return bTime - aTime;
      }

      return (b[1].lastSeen || 0) - (a[1].lastSeen || 0);
    });

  players.forEach(([name, player]) => {
    if (!name.toLowerCase().includes(search)) {
      return;
    }

    const home = getLikelyHome(player);

    const div = document.createElement("div");

    div.className = "player";

    div.innerHTML = `
      <div class="playerTop">
        <div class="playerName">${escapeHTML(name)}</div>

        <div class="${
          player.online
            ? "onlineStatus"
            : "offlineStatus"
        }">
          ${
            player.online
              ? "ONLINE"
              : "OFFLINE"
          }
        </div>
      </div>

      <div class="coords">
        Time online: ${formatTime(player.totalOnlineTime || 0)}<br>
        Head X: ${player.x ?? "?"}<br>
        Head Y: ${player.y ?? "?"}<br>
        Head Z: ${player.z ?? "?"}<br>
        Left hand: ${player.hasLeftHand ? "YES" : "NO"}<br>
        Right hand: ${player.hasRightHand ? "YES" : "NO"}<br>
        Saved points: ${
          Array.isArray(player.history)
            ? player.history.length
            : 0
        }
      </div>

      <div class="home">
        ${
          home
            ? `Likely Home X:${home.x} Y:${home.y} Z:${home.z}<br>Teleports:${home.count}`
            : "Likely home unknown"
        }
      </div>

      <div class="buttons">
        <button class="tp">Copy TP</button>
        <button class="homeBtn">Copy Home</button>
        <button class="secondary view">View</button>
      </div>
    `;

    div.querySelector(".tp").onclick = () => {
      copy(`${player.x} ${player.y} ${player.z}`);
    };

    div.querySelector(".homeBtn").onclick = () => {
      if (!home) {
        return;
      }

      copy(`${home.x} ${home.y} ${home.z}`);
    };

    div.querySelector(".view").onclick = () => {
      if (
        player.lat === undefined ||
        player.lng === undefined
      ) {
        return;
      }

      gameMap.setView([player.lat, player.lng], 4);
    };

    container.appendChild(div);
  });

  updateStats();
}

function setupSearch() {
  document.getElementById("search").addEventListener(
    "input",
    renderPlayers
  );
}

function startApp() {
  if (appStarted) {
    return;
  }

  appStarted = true;

  setupMap();
  setupButtons();
  setupSearch();

  renderPlayers();
  refreshHeatMap();
  loadPlayers();

  setInterval(loadPlayers, 3000);
}
</script>
